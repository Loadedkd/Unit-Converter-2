<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Unit Converter 2</title></head>
<body style="background:#0f0f1e;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif">
<div style="background:white;padding:28px;border-radius:24px;width:90%;max-width:360px;text-align:center">
<h1>Unit Converter 2 ⚡</h1>
<input id="value" type="number" value="1" style="width:100%;padding:12px;margin:10px 0;border-radius:12px;border:2px solid #e9e5ff">
<button onclick="convert()" style="width:100%;padding:14px;background:#8A5CF5;color:white;border:none;border-radius:14px;font-weight:bold">Convert KM to M</button>
<div id="result" style="margin-top:16px;font-weight:bold;color:#8A5CF5"></div>
<script>function convert(){let v=document.getElementById('value').value; document.getElementById('result').innerText=v+' km = '+(v*1000)+' m';}convert()</script>
</div></div></body></html>
